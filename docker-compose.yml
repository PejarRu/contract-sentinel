services:
  sentinel:
    image: contract-sentinel:${IMAGE_TAG:-latest}
    build: .
    environment:
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      CHAIN_ID: ${CHAIN_ID:-1}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/contract-sentinel.sqlite}
      CONTRACTS_DIR: ${CONTRACTS_DIR:-/app/contracts}
      REPORTS_DIR: ${REPORTS_DIR:-/app/reports}
      SCAN_INTERVAL_MIN: ${SCAN_INTERVAL_MIN:-15}
      MOCK_MODE: ${MOCK_MODE:-0}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_TO: ${EMAIL_TO:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./data:/app/data
      - ./contracts:/app/contracts
      - ./reports:/app/reports
    command: ["watch"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/data/contract-sentinel.sqlite"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
